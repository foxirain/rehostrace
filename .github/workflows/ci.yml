name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the Python package
        run: python -m pip install .
      - name: Verify framework contracts and release scope
        run: make verify
