<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">RehostRace — Bluetooth research within GW TakeDown</title>
  <desc id="desc">A restrained technical banner connecting the GW TakeDown project to its Bluetooth research track and RehostRace, with two asynchronous paths converging on a shared object.</desc>

  <rect width="1280" height="360" fill="#0a0c0f"/>
  <path d="M0 1H1280M0 359H1280" stroke="#262b31"/>
  <path d="M48 48V312" stroke="#64e8c8" stroke-width="3"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="82" y="66" fill="#82909f" font-size="13" font-weight="600" letter-spacing="2.2">GW TAKE DOWN  /  BLUETOOTH RESEARCH</text>
    <text x="82" y="306" fill="#82909f" font-size="12" letter-spacing="1.35">CAPTURE  /  REPLAY  /  SCHEDULE  /  EVIDENCE</text>
  </g>

  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="78" y="169" fill="#f3f5f7" font-size="76" font-weight="700" letter-spacing="-3.5">Rehost</text>
    <text x="315" y="169" fill="#64e8c8" font-size="76" font-weight="700" letter-spacing="-3.5">Race</text>
    <text x="82" y="212" fill="#b2bac4" font-size="20" font-weight="400" letter-spacing="0.1">Causality-preserving rehosting for Bluetooth concurrency</text>
  </g>

  <path d="M640 48V312" stroke="#262b31"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="684" y="66" fill="#65717d" font-size="11" font-weight="600" letter-spacing="1.7">PROJECT POSITION</text>

    <text x="684" y="105" fill="#d8dde3" font-size="12" font-weight="600" letter-spacing="1.15">GW TAKE DOWN</text>
    <path d="M792 101H836" stroke="#4b545f"/>
    <path d="m831 97 5 4-5 4" fill="none" stroke="#4b545f"/>
    <text x="850" y="105" fill="#d8dde3" font-size="12" font-weight="600" letter-spacing="1.15">BLUETOOTH</text>
    <path d="M938 101H982" stroke="#4b545f"/>
    <path d="m977 97 5 4-5 4" fill="none" stroke="#4b545f"/>
    <text x="996" y="105" fill="#64e8c8" font-size="12" font-weight="700" letter-spacing="1.15">REHOSTRACE</text>

    <text x="684" y="160" fill="#687481" font-size="11" letter-spacing="1.4">TX / ASYNC PATH</text>
    <text x="684" y="275" fill="#687481" font-size="11" letter-spacing="1.4">RX / ASYNC PATH</text>
    <text x="925" y="289" fill="#82909f" font-size="10" letter-spacing="1.25">SAME OBJECT</text>
    <text x="1135" y="225" fill="#82909f" font-size="10" letter-spacing="1.25">ORACLE</text>
  </g>

  <g fill="none" stroke-linecap="square" stroke-linejoin="round">
    <path d="M684 183H808C864 183 888 199 924 222L946 236" stroke="#e5e9ed" stroke-width="2"/>
    <path d="M684 252H808C864 252 888 247 924 239L946 236" stroke="#64e8c8" stroke-width="2"/>
    <path d="M982 236H1168" stroke="#e5e9ed" stroke-width="2"/>
    <path d="m1161 230 7 6-7 6" stroke="#e5e9ed" stroke-width="2"/>

    <circle cx="752" cy="183" r="5" fill="#0a0c0f" stroke="#e5e9ed" stroke-width="2"/>
    <circle cx="834" cy="185" r="5" fill="#0a0c0f" stroke="#e5e9ed" stroke-width="2"/>
    <circle cx="752" cy="252" r="5" fill="#0a0c0f" stroke="#64e8c8" stroke-width="2"/>
    <circle cx="834" cy="251" r="5" fill="#0a0c0f" stroke="#64e8c8" stroke-width="2"/>

    <circle cx="964" cy="236" r="18" fill="#0a0c0f" stroke="#64e8c8" stroke-width="2"/>
    <circle cx="964" cy="236" r="5" fill="#64e8c8" stroke="none"/>

    <path d="M1110 225V247M1118 225V247" stroke="#64e8c8" stroke-width="2"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" fill="#59636e" font-size="9" letter-spacing="1">
    <text x="733" y="202">CAPTURE</text>
    <text x="818" y="204">GATE</text>
    <text x="733" y="270">CAPTURE</text>
    <text x="818" y="270">GATE</text>
  </g>
</svg>
