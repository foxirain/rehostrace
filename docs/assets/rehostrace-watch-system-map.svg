    <rect x="1128" y="171" width="82" height="58" stroke="#59636e" stroke-dasharray="5 5"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">
    <text x="545" y="195" fill="#9aa5b1" font-size="9" font-weight="700" letter-spacing="0.8">REMOTE</text>
    <text x="545" y="211" fill="#9aa5b1" font-size="9" font-weight="700" letter-spacing="0.8">PEER</text>
    <text x="651" y="204" fill="#9aa5b1" font-size="10" font-weight="700" letter-spacing="0.9">RADIO</text>
    <text x="757" y="195" fill="#d8dde3" font-size="9" font-weight="700" letter-spacing="0.75">BT</text>
    <text x="757" y="211" fill="#d8dde3" font-size="9" font-weight="700" letter-spacing="0.75">CONTROLLER</text>
    <text x="847" y="204" fill="#d8dde3" font-size="10" font-weight="700" letter-spacing="0.9">HCI</text>
    <text x="947" y="194" fill="#f3f5f7" font-size="10" font-weight="700" letter-spacing="0.75">KERNEL BT</text>
    <text x="947" y="214" fill="#64e8c8" font-size="8" letter-spacing="0.8">REPLAY CORE</text>
    <text x="1065" y="195" fill="#9aa5b1" font-size="9" font-weight="700" letter-spacing="0.75">HOST</text>
    <text x="1065" y="211" fill="#9aa5b1" font-size="9" font-weight="700" letter-spacing="0.75">STACK</text>
    <text x="1169" y="204" fill="#9aa5b1" font-size="9" font-weight="700" letter-spacing="0.75">APPS</text>
  </g>

  <!-- Controlled boundary zoom -->
  <g fill="none" stroke-linejoin="round">
    <path d="M818 263V278H1002V263" stroke="#64e8c8" stroke-width="2"/>
    <rect x="738" y="304" width="344" height="70" fill="#101815" stroke="#64e8c8" stroke-width="2"/>
    <path d="M847 278V304M947 237V304" stroke="#64e8c8" stroke-width="2"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">
    <text x="910" y="329" fill="#64e8c8" font-size="10" font-weight="700" letter-spacing="1.2">CONTROLLED ASYNCHRONOUS BOUNDARY</text>
    <text x="910" y="350" fill="#e5e9ed" font-size="11">capture  →  replay  →  schedule  →  lifetime oracle</text>
  </g>

  <!-- Scope explanation -->
  <path d="M500 402H1204" stroke="#262b31"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="500" y="431" width="214" height="103" fill="#101815" stroke="#64e8c8" stroke-width="2"/>
    <text x="518" y="457" fill="#64e8c8" font-size="10" font-weight="700" letter-spacing="1.25">CORE / CONTROLLED</text>
    <text x="518" y="482" fill="#e5e9ed" font-size="11">Kernel boundary actions</text>
    <text x="518" y="501" fill="#e5e9ed" font-size="11">Deterministic interleavings</text>
    <text x="518" y="520" fill="#e5e9ed" font-size="11">Identity + lifetime oracle</text>

    <rect x="734" y="431" width="214" height="103" stroke="#e5e9ed" stroke-width="2"/>
    <text x="752" y="457" fill="#d8dde3" font-size="10" font-weight="700" letter-spacing="1.25">BOUNDARY / INPUT</text>
    <text x="752" y="482" fill="#9aa5b1" font-size="11">HCI and protocol traces</text>
    <text x="752" y="501" fill="#9aa5b1" font-size="11">Controller event contract</text>
    <text x="752" y="520" fill="#9aa5b1" font-size="11">Target lowering plan</text>

    <rect x="968" y="431" width="236" height="103" stroke="#59636e" stroke-dasharray="5 5"/>
    <text x="986" y="457" fill="#82909f" font-size="10" font-weight="700" letter-spacing="1.25">CONTEXT / NOT CLAIMED</text>
    <text x="986" y="482" fill="#65717d" font-size="11">Physical radio behavior</text>
    <text x="986" y="501" fill="#65717d" font-size="11">Whole controller firmware</text>
    <text x="986" y="520" fill="#65717d" font-size="11">End-to-end device fidelity</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="48" y="596" fill="#65717d" font-size="10" letter-spacing="1.25">POSITION  /  INSIDE THE WATCH AP KERNEL, IMMEDIATELY ABOVE THE CONTROLLER / HCI EDGE</text>
    <text x="500" y="574" fill="#82909f" font-size="10" letter-spacing="1.1">REHOSTRACE CONTROLS SOFTWARE INTERLEAVINGS  /  IT DOES NOT CLAIM RF OR WHOLE-CONTROLLER EMULATION</text>
  </g>
</svg>
