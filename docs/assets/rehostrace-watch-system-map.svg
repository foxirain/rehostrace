  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="120" y="228" fill="#65717d" font-size="10" letter-spacing="1.45">WATCH MAINBOARD</text>

    <rect x="120" y="246" width="240" height="118" rx="3" fill="#0a0c0f" stroke="#e5e9ed" stroke-width="2"/>
    <text x="140" y="273" fill="#82909f" font-size="10" letter-spacing="1.35">APPLICATION PROCESSOR</text>
    <text x="140" y="293" fill="#65717d" font-size="9" letter-spacing="0.9">LINUX / HOST SIDE</text>
    <rect x="136" y="307" width="208" height="39" fill="#101815" stroke="#64e8c8" stroke-width="2"/>
    <text x="152" y="331" fill="#f3f5f7" font-size="11" font-weight="700" letter-spacing="0.8">KERNEL BT COMPONENT</text>

    <rect x="120" y="392" width="108" height="52" fill="#0a0c0f" stroke="#e5e9ed" stroke-width="2"/>
    <text x="136" y="415" fill="#d8dde3" font-size="9" font-weight="700" letter-spacing="0.8">BT CONTROLLER</text>
    <text x="136" y="431" fill="#65717d" font-size="8" letter-spacing="0.7">FIRMWARE EDGE</text>

    <rect x="252" y="392" width="108" height="52" fill="#0a0c0f" stroke="#59636e" stroke-dasharray="5 5"/>
    <text x="268" y="415" fill="#9aa5b1" font-size="9" font-weight="700" letter-spacing="0.8">RADIO / RF</text>
    <text x="268" y="431" fill="#65717d" font-size="8" letter-spacing="0.7">PHYSICAL LINK</text>
  </g>

  <g fill="none" stroke-linecap="square">
    <path d="M174 392V379H202V364" stroke="#e5e9ed" stroke-width="2"/>
    <path d="M252 418H228" stroke="#e5e9ed" stroke-width="2"/>
