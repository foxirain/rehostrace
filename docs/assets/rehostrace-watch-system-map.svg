<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Wearable watch architecture map showing where RehostRace operates</title>
  <desc id="desc">A conceptual cutaway of a wearable watch highlights the kernel Bluetooth component inside the application processor. A logical zoom follows a Bluetooth event from a remote peer through radio, controller, HCI, the kernel component, the host stack, and applications, with RehostRace focused on asynchronous kernel-boundary replay rather than radio or controller emulation.</desc>

  <rect width="1280" height="640" fill="#0a0c0f"/>
  <path d="M0 1H1280M0 639H1280" stroke="#262b31"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="48" y="52" fill="#64e8c8" font-size="13" font-weight="700" letter-spacing="2.2">WATCH ARCHITECTURE MAP</text>
    <text x="279" y="52" fill="#82909f" font-size="11" letter-spacing="1.35">/  WHERE REHOSTRACE SITS</text>

    <path d="M866 46H894" stroke="#64e8c8" stroke-width="3"/>
    <text x="906" y="51" fill="#9aa5b1" font-size="11" letter-spacing="1.1">CORE SCOPE</text>
    <path d="M1008 46H1036" stroke="#e5e9ed" stroke-width="2"/>
    <text x="1048" y="51" fill="#9aa5b1" font-size="11" letter-spacing="1.1">BOUNDARY</text>
    <path d="M1149 46H1177" stroke="#59636e" stroke-dasharray="5 5"/>
    <text x="1189" y="51" fill="#9aa5b1" font-size="11" letter-spacing="1.1">CONTEXT</text>
  </g>

  <path d="M48 88H1232" stroke="#262b31"/>
  <path d="M460 112V584" stroke="#262b31"/>

  <!-- Conceptual physical placement -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="48" y="119" fill="#65717d" font-size="10" font-weight="600" letter-spacing="1.7">01 / PHYSICAL POSITION</text>
    <text x="48" y="138" fill="#82909f" font-size="9" letter-spacing="1.15">CONCEPTUAL PLACEMENT — NOT PCB SCALE</text>
  </g>

  <g fill="none" stroke-linejoin="round">
    <path d="M169 173V143C169 129 180 118 194 118H286C300 118 311 129 311 143V173" stroke="#4b545f" stroke-width="2"/>
    <path d="M169 493V523C169 537 180 548 194 548H286C300 548 311 537 311 523V493" stroke="#4b545f" stroke-width="2"/>
    <rect x="72" y="173" width="336" height="320" rx="78" stroke="#d8dde3" stroke-width="2"/>
    <rect x="96" y="197" width="288" height="272" rx="58" fill="#0d1013" stroke="#30363d" stroke-width="2"/>
